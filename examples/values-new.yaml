# Example new Helm values — works with both --component generic and --component loki
replicaCount: 3

image:
  repository: grafana/loki
  tag: "2.9.4"

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

service:
  type: LoadBalancer

ingress:
  enabled: true
  hosts:
    - host: loki.example.com
      paths:
        - path: /

persistence:
  enabled: true
  size: 20Gi

loki:
  limits_config:
    retention_period: 720h
    ingestion_rate_mb: 20

  schemaConfig:
    configs:
      - from: "2020-10-24"
        schema: v12
        object_store: s3
        store: tsdb

  storage:
    bucketNames:
      chunks: loki-chunks-prod

  compactor:
    retention_enabled: true

env:
  - name: LOG_LEVEL
    value: debug

extraEnv:
  - name: JAEGER_AGENT_HOST
    value: jaeger-agent.monitoring
