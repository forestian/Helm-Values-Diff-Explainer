name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  BINARY: hvediff
  MODULE: helm-values-diff-explainer

jobs:
  # ── 1. test ────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files need gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Run tests
        run: go test ./...

  # ── 2. build ───────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          OUTPUT="${{ env.BINARY }}"
          [ "$GOOS" = "windows" ] && OUTPUT="${OUTPUT}.exe"

          go build \
            -ldflags="-s -w -X ${{ env.MODULE }}/cmd.Version=${TAG}" \
            -o "${OUTPUT}" .

          ARCHIVE="${{ env.BINARY }}_${TAG}_${GOOS}_${GOARCH}.tar.gz"
          tar -czf "${ARCHIVE}" "${OUTPUT}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: "*.tar.gz"
          if-no-files-found: error
          retention-days: 1

  # ── 3. release ─────────────────────────────────────────────────────────────
  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.BINARY }}_*
          merge-multiple: true
          path: dist/

      - name: Generate checksums.txt
        run: |
          cd dist
          sha256sum *.tar.gz | tee checksums.txt

      - name: Create release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release $TAG already exists — skipping creation, will only upload assets"
          else
            echo "Release $TAG not found — creating"
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "Release $TAG" \
              --repo "${{ github.repository }}"
          fi

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.ver.outputs.tag }}" \
            dist/*.tar.gz \
            dist/checksums.txt \
            --clobber \
            --repo "${{ github.repository }}"
